name: Contract CI

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reject tracked private env files
        run: |
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Private env file(s) must never be committed:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests
        run: npm test

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/abi.js
          node --check frontend/config.js

      - name: Check browser Ethers bundle
        run: |
          grep -Fq "ethers.umd.min.js" frontend/index.html
          if grep -Fq "/ethers.min.js" frontend/index.html; then
            echo "Use the Ethers UMD browser bundle, not the ESM bundle with a classic script tag."
            exit 1
          fi
